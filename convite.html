<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Convite - Reunião Noturna Campal</title>

<style>

    * {
        box-sizing: border-box;
    }


    html,
    body {

        margin: 0;
        padding: 0;

        width: 100%;
        min-height: 100%;

    }


    body {

        background: #020813;

        color: #ffffff;

        font-family: Arial, sans-serif;

        text-align: center;

        padding: 10px;

    }


    .pagina {

        width: 100%;

        max-width: 850px;

        margin: 0 auto;

    }


    /* ===============================
       IMAGEM DO CONVITE
    =============================== */

    .imagem-convite {

        display: block;

        width: 100%;

        height: auto;

        margin: 0 auto;

        border: 1px solid #d4af37;

        box-shadow:
            0 0 25px
            rgba(212, 175, 55, 0.18);

    }


    /* ===============================
       ÁREA DE INSCRIÇÃO
    =============================== */

    .area-inscricao {

        margin: 20px 0 10px;

        padding: 20px 15px;

        border:
            1px solid
            rgba(212, 175, 55, 0.35);

        border-radius: 8px;

        background:
            rgba(13, 27, 42, 0.95);

    }


    /* ===============================
       PIX
    =============================== */

    .pix-titulo {

        color: #d4af37;

        font-family:
            Georgia,
            serif;

        font-size: 15px;

        font-weight: bold;

        letter-spacing: 1px;

        margin-bottom: 10px;

    }


    .pix-info {

        color: #cccccc;

        font-size: 18px;

        line-height: 1.5;

        margin-bottom: 10px;

    }


    /* ===============================
       QR CODE PIX
    =============================== */

    .qrcode-pix {

        display: flex;

        justify-content: center;

        align-items: center;

        width: fit-content;

        margin: 15px auto;

        padding: 12px;

        background: #ffffff;

        border:
            2px solid
            #d4af37;

        border-radius: 8px;

        box-shadow:
            0 0 18px
            rgba(212, 175, 55, 0.25);

    }


    .qrcode-pix img {

        display: block;

        width: 220px;

        height: 220px;

        object-fit: contain;

    }


    /* ===============================
       BOTÃO COPIAR PIX
    =============================== */

    .botao-pix {

        display: flex;

        align-items: center;

        justify-content: center;

        width: 100%;

        min-height: 52px;

        padding: 12px;

        margin: 10px auto 8px;

        border: 1px solid #d4af37;

        border-radius: 6px;

        background:
            rgba(212, 175, 55, 0.12);

        color: #f3e5ab;

        font-size: 14px;

        font-weight: bold;

        letter-spacing: 0.7px;

        cursor: pointer;

    }


    .botao-pix:active {

        transform: scale(0.98);

        background:
            rgba(212, 175, 55, 0.25);

    }


    .mensagem-pix {

        min-height: 20px;

        margin-bottom: 12px;

        color: #f3e5ab;

        font-size: 12px;

    }


    .favorecido {

        color: #cccccc;

        font-size: 12px;

        line-height: 1.5;

        margin-bottom: 20px;

    }


    /* ===============================
       BOTÃO GOOGLE FORMS
    =============================== */

    .botao-inscricao {

        display:
            flex;

        align-items:
            center;

        justify-content:
            center;

        width:
            100%;

        min-height:
            58px;

        padding:
            14px;

        border:
            2px solid
            #ffffff;

        border-radius:
            6px;

        background:
            linear-gradient(
                to bottom,
                #f3e5ab,
                #d4af37
            );

        color:
            #020813;

        text-decoration:
            none;

        font-size:
            15px;

        font-weight:
            bold;

        letter-spacing:
            0.8px;

        box-shadow:
            0 4px 20px
            rgba(212, 175, 55, 0.4);

    }


    .botao-inscricao:active {

        transform:
            scale(0.98);

    }


    /* ===============================
       CONTATO
    =============================== */

    .contato {

        margin-top: 22px;

        padding-top: 18px;

        border-top:
            1px solid
            rgba(255,255,255,0.12);

        color: #ffffff;

        font-size: 18px;

        line-height: 1.6;

    }


    .contato strong {

        color: #d4af37;

    }


    /* ===============================
       DESKTOP
    =============================== */

    @media (min-width: 600px) {

        body {

            padding:
                20px;

        }


        .botao-inscricao {

            width:
                350px;

            margin:
                0 auto;

        }


        .botao-pix {

            width:
                280px;

            margin:
                10px auto 8px;

        }


        .qrcode-pix img {

            width:
                250px;

            height:
                250px;

        }

    }

</style>

</head>

<body>

<main class="pagina">

<!-- IMAGEM DO CONVITE -->

<img
    src="Imagens/convite.jpg"
    alt="Convite da Reunião Noturna Campal"
    class="imagem-convite"
>


<!-- PAGAMENTO E INSCRIÇÃO -->

<section class="area-inscricao">


    <!-- PIX -->

    <div class="pix-titulo">

        PAGAMENTO DA INSCRIÇÃO

    </div>


    <div class="pix-info">

        Taxa de inscrição: <strong>R$ 50,00</strong>

        <br>

        <span style="font-size: 14px; color: #f3e5ab;">

            Escaneie o QR Code abaixo para realizar o pagamento via PIX.

        </span>

    </div>


    <!-- QR CODE -->

    <div class="qrcode-pix">

        <img
            src="QRCODE.JPEG"
            alt="QR Code para pagamento via PIX"
        >

    </div>


    <!-- BOTÃO COPIAR -->

    <button
        type="button"
        class="botao-pix"
        onclick="copiarPix()"
    >

        📋 COPIAR PIX

    </button>


    <div
        id="mensagemPix"
        class="mensagem-pix"
        aria-live="polite"
    ></div>


    <!-- INSCRIÇÃO -->

    <a
        href="https://forms.gle/2SQPeh3or9odEqGs8"
        target="_blank"
        rel="noopener noreferrer"
        class="botao-inscricao"
    >

        ✦ FAZER MINHA INSCRIÇÃO ✦

    </a>


    <!-- COMPROVANTE -->

    <div class="contato">

        <strong>

            APÓS O PAGAMENTO,
            ENVIAR O COMPROVANTE PARA

        </strong>

        <br>
        <br>

        <strong>IR JOSÉ JULIO - (32) 98875-5765</strong>

    </div>


</section>

</main>


<!-- ===============================
     JAVASCRIPT - COPIAR PIX
================================ -->

<script>

function copiarPix() {

    const chavePix =
        "00020101021126360014br.gov.bcb.pix011419558956000131520400005303986540550.005802BR5925LOJA MACONICA PORTAL DA M6009BARBACENA62070503***63047F3D";

    const mensagem =
        document.getElementById(
            "mensagemPix"
        );


    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        navigator.clipboard
            .writeText(chavePix)

            .then(function () {

                mensagem.textContent =
                    "✅ PIX Copia e Cola copiado!";

            })

            .catch(function () {

                copiarAlternativo(
                    chavePix,
                    mensagem
                );

            });

    }

    else {

        copiarAlternativo(
            chavePix,
            mensagem
        );

    }

}


function copiarAlternativo(
    chavePix,
    mensagem
) {

    const campo =
        document.createElement(
            "textarea"
        );


    campo.value =
        chavePix;

    campo.style.position =
        "fixed";

    campo.style.opacity =
        "0";

    document.body.appendChild(
        campo
    );

    campo.focus();

    campo.select();


    try {

        document.execCommand(
            "copy"
        );

        mensagem.textContent =
            "✅ PIX Copia e Cola copiado!";

    }

    catch (erro) {

        mensagem.textContent =
            "⚠️ Não foi possível copiar. Tente novamente.";

    }


    document.body.removeChild(
        campo
    );

}

</script>

</body>

</html>
